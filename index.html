<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Маршрутизатор</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <meta name="theme-color" content="#0d1420">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0d1420;
            color: #f4f7ff;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            font-weight: 400;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .phone-screen {
            width: 100%;
            max-width: 640px;
            min-height: auto;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 28px 24px;
            position: relative;
            overflow: hidden;
        }

    /* Плашка даты смены + «Ночь» */
    .shift-date-card {
        width: 100%;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 14px;
        margin-bottom: 12px;
        overflow: hidden;
    }

    .shift-date-main {
        padding: 4px 12px;
    }

    .shift-date-picker {
        position: relative;
        display: block;
        min-height: 48px;
        padding: 12px 48px 12px 8px;
        cursor: pointer;
        user-select: none;
    }

    .shift-date-display {
        display: block;
        color: #ffffff;
        font-size: 16px;
        font-weight: 600;
        line-height: 1.35;
        letter-spacing: -0.01em;
        pointer-events: none;
    }

    .shift-date-input {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        border: none;
        outline: none;
        background: transparent;
        color: transparent;
        opacity: 0;
        cursor: pointer;
        color-scheme: dark;
        font-size: 16px;
        z-index: 2;
    }

    .shift-date-input:focus {
        outline: none;
    }

    .shift-date-card:focus-within .shift-date-main {
        background: rgba(255, 255, 255, 0.03);
    }

    .shift-date-input::-webkit-calendar-picker-indicator {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        cursor: pointer;
        opacity: 0;
    }

    .shift-date-calendar-icon {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        width: 22px;
        height: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #8b97ab;
        pointer-events: none;
        z-index: 1;
        transition: color 0.2s ease;
    }

    .shift-date-picker:hover .shift-date-calendar-icon,
    .shift-date-picker:active .shift-date-calendar-icon {
        color: #b8c4d8;
    }

    .shift-date-night {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 16px 16px;
        background: rgba(0, 0, 0, 0.18);
        border-top: none;
        font-size: 14px;
        color: #5a6a82;
    }

    .shift-date-night-label {
        color: #5a6a82;
        font-weight: 400;
    }

    .night-switch {
        position: relative;
        display: inline-block;
        width: 44px;
        height: 24px;
        flex-shrink: 0;
    }

    .night-switch input {
        opacity: 0;
        width: 0;
        height: 0;
    }

    .night-switch-slider {
        position: absolute;
        cursor: pointer;
        inset: 0;
        background: #252d3a;
        border-radius: 26px;
        transition: background 0.2s ease, box-shadow 0.2s ease;
    }

    .night-switch-slider::before {
        content: '';
        position: absolute;
        height: 18px;
        width: 18px;
        left: 3px;
        bottom: 3px;
        background: #ffffff;
        border-radius: 50%;
        transition: transform 0.2s ease;
    }

    .night-switch input:checked + .night-switch-slider {
        background: #178038;
        box-shadow: 0 0 8px rgba(23, 128, 56, 0.35);
    }

    .night-switch input:checked + .night-switch-slider::before {
        transform: translateX(20px);
    }

        /* Переключатель вкладок */
        .tabs-nav {
            display: flex;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 2px;
            margin-bottom: 16px;
            backdrop-filter: blur(5px);
        }

        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            padding: 8px 10px;
            font-size: 13px;
            font-weight: 500;
            color: #c4d1e8;
            cursor: pointer;
            border-radius: 10px;
            transition: transform 0.2s ease, color 0.2s ease, background 0.2s ease;
        }

        .tab-btn:hover {
            color: #f7fbff;
            transform: translateY(-1px);
        }

        .tab-btn.active {
            background: rgba(0, 113, 227, 0.14);
            color: #ffffff;
            font-weight: 600;
            box-shadow: inset 0 0 0 1px rgba(0, 113, 227, 0.22);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .schedule-search {
            margin-bottom: 8px;
        }

        .schedule-search-field {
            width: 100%;
        }

        .schedule-search-btn {
            width: 100%;
            margin-top: 12px;
        }

        .schedule-date-hint {
            margin: 0 0 12px;
            font-size: 13px;
            color: #5a6a82;
            line-height: 1.4;
        }

        .schedule-empty {
            display: block;
            text-align: center;
            color: #5a6a82;
            font-size: 14px;
            margin: 8px 0 16px;
            padding: 12px 8px;
        }

        .schedule-route-card {
            margin-bottom: 14px;
        }

        .schedule-results-wrap {
            animation: fadeInScale 0.3s ease-out;
        }

        .schedule-loader {
            margin-bottom: 16px;
        }

        .action-btn {
            background-color: #178038;
            color: #ffffff;
            border: none;
            border-radius: 14px;
            padding: 12px 22px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .action-btn:hover {
            background-color: #1f8440;
            transform: translateY(-1px);
        }

        .action-btn:active {
            background-color: #0f5a2c;
        }

        button:focus-visible,
        .train-input:focus-visible {
            outline: 2px solid rgba(29, 167, 69, 0.45);
            outline-offset: 2px;
        }

        .trains-dynamic {
            margin-bottom: 12px;
        }

        .trains-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 6px;
        }

        .train-field {
            position: relative;
            min-width: 0;
        }

        .train-field-clear {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            width: 26px;
            height: 26px;
            padding: 0;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: #5a6a82;
            font-size: 18px;
            line-height: 1;
            font-weight: 400;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s ease, background 0.2s ease;
            z-index: 2;
        }

        .train-field-clear:hover,
        .train-field-clear:focus-visible {
            color: #9db0cf;
            background: rgba(255, 255, 255, 0.06);
        }

        .train-field--has-clear .train-input {
            padding-right: 34px;
        }

        .train-input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 10px;
            font-size: 14px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            outline: none;
            background: rgba(255, 255, 255, 0.06);
            color: #f4f7ff;
            backdrop-filter: blur(10px);
            text-align: left;
            font-weight: 400;
            transition: border-color 0.2s ease, background 0.2s ease, color 0.2s ease, font-weight 0.2s ease;
            min-width: 0;
            line-height: 1.2;
        }

        .train-input:focus {
            border-color: #178038;
            background: rgba(255, 255, 255, 0.12);
        }

        .train-input::placeholder {
            color: #4a5668;
            font-size: 12px;
            font-weight: 400;
            opacity: 0.9;
        }

        .train-input:not(:placeholder-shown) {
            color: #f4f7ff;
            font-weight: 600;
        }

        .trains-submit {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
        }

        .add-train-btn {
            display: block;
            width: 100%;
            margin: 0;
            padding: 6px 0 2px;
            border: none;
            background: transparent;
            color: #5a6a82;
            font-size: 14px;
            font-weight: 400;
            cursor: pointer;
            text-align: center;
            transition: color 0.2s ease;
        }

        .add-train-btn:hover {
            color: #9db0cf;
        }

        .add-train-btn:disabled {
            opacity: 0.35;
            cursor: default;
        }

        .trains-submit .action-btn {
            flex: 1;
        }

        @media (max-width: 430px) {
            .train-input {
                padding: 10px 8px;
                font-size: 13px;
            }

            .train-input::placeholder {
                font-size: 11px;
            }

            .trains-submit {
                gap: 8px;
            }
        }
        /* ===== МАРШРУТЫ: Контейнер с карточками ===== */
        .route-grid {
            display: flex; /* Контейнер для вертикального стека */
            flex-direction: column; /* Карточки идут вниз */
            gap: 12px; /* Расстояние между карточками */
            width: 100%; /* Займёт всю доступную ширину */
        }

        @keyframes fadeInScale {
            from {
                opacity: 0; /* Карточка появляется прозрачной */
                transform: translateY(6px); /* И немного выше позиции */
            }
            to {
                opacity: 1; /* Становится видимой */
                transform: translateY(0); /* И опускается в свою позицию */
            }
        }

        /* ===== МАРШРУТЫ: Сама карточка маршрута ===== */
        .route-card {
            background: #141b27; /* Глубокий тёмно-синий фон карточки */
            border: 1px solid rgba(255, 255, 255, 0.05); /* Тончайшая белая обводка */
            border-radius: 12px; /* Мягкие скругленные углы */
            padding: 0; /* Отступы внутри задаются через .route-card-section */
            display: flex; /* Флекс-контейнер для секций */
            flex-direction: column; /* Три секции (top/middle/bottom) идут вниз */
            position: relative; /* Базис для абсолютного позиционирования ::before */
            overflow: hidden; /* Скрывает содержимое за границами */
            transition: border-color 0.2s ease, background 0.2s ease; /* Плавная смена цветов при наведении */
            animation: fadeInScale 0.3s ease-out; /* Анимация появления карточки */
        }

        /* Наведение на карточку — делает её кликабельной и меняет стиль */
        .route-card.clickable { cursor: pointer; } /* Показывает, что кликабельна */
        .route-card.clickable:hover {
            border-color: rgba(255, 255, 255, 0.12); /* Обводка слегка светлеет */
            background: #192232; /* Фон светлеет */
        }

        /* Синий вертикальный полоска слева — визуальный маркер маршрута */
        .route-card::before {
            content: ''; /* Псевдоэлемент */
            position: absolute; /* Позиционируется абсолютно внутри карточки */
            left: 0; /* К левому краю */
            top: 0; /* От верхнего края */
            width: 6px; /* Ширина полоски */
            height: 100%; /* На всю высоту карточки */
            background: #8295ff; /* Благородный синий цвет */
        }

        /* Внутренние отступы для всех трёх секций карточки */
        .route-card-section {
            padding: 8px 14px 8px 22px; /* Верх 8px | Право 14px | Низ 8px | Слева 22px (место под синюю полоску) */
        }

        /* ===== МАРШРУТЫ: Верхняя секция — маршрут и остановки ===== */
        .route-card-top {
            display: flex; /* Flex-контейнер */
            flex-direction: column; /* Содержимое идёт вниз */
            gap: 2px; /* Минимальный зазор между названием и номером/остановками */
            border-bottom: 1px dashed rgba(255, 255, 255, 0.06); /* Тонкий пунктир-разделитель */
            overflow: hidden; /* Скрывает переполнение */
        }

        /* Название маршрута (например "Москва — Ярославль") */
        .route-card-title {
            font-size: 16px; /* Размер шрифта */
            font-weight: 600; /* Полужирный */
            color: #ffffff; /* Белый цвет */
            white-space: nowrap; /* Не переносит текст */
            overflow: hidden; /* Если длинный — скрывает */
            text-overflow: ellipsis; /* Добавляет многоточие в конце */
            width: 100%; /* Займёт всю ширину */
        }

        /* Подстрока в верхней секции: номер поезда и количество остановок */
        .route-card-subtitle {
            display: flex; /* Флекс для расположения по горизонтали */
            justify-content: space-between; /* Номер слева, остановки справа */
            gap: 12px; /* Расстояние между ними */
            font-size: 12px; /* Маленький шрифт */
            color: #8393af; /* Серый приглушённый цвет */
            overflow: hidden; /* Скрывает переполнение */
        }

        /* Левая часть подстроки (номер поезда) */
        .route-card-subtitle span:first-child {
            white-space: nowrap; /* Не переносит текст */
            flex-shrink: 0; /* Не сжимается */
        }

        /* Правая часть подстроки (список остановок Яндекса) */
        .route-card-subtitle span:last-child {
            white-space: nowrap; /* Не переносит */
            overflow: hidden; /* Скрывает, если выходит за границы */
            text-overflow: ellipsis; /* Добавляет многоточие */
            text-align: right; /* Выравнивает текст вправо */
        }

        /* ===== МАРШРУТЫ: Средняя секция — время и пробы ===== */
        .route-card-middle {
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.06);
        }

        .route-card-middle-head {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
        }

        /* Время отправки и прибытия (22:15 - 06:45) */
        .route-time {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
            flex-shrink: 0;
        }

        .route-date {
            font-size: 13px;
            color: #8393af;
            flex-shrink: 0;
            white-space: nowrap;
        }

        /* Контейнер для плашек с пробами (если есть) */
        .route-tags-container {
            display: flex; /* Flex для расположения по горизонтали */
            gap: 8px; /* Маленькое расстояние между плашками */
            flex-wrap: wrap; /* Переносит плашки на новую строку, если много */
            align-items: flex-start; /* Плашки выравниваются по верхнему краю */
        }

        /* Одна плашка с пробой (например "ПТ — 42пк3" или "Тупик — 156пк8") */
        .route-brake-box {
            border: 1px solid rgba(234, 179, 8, 0.2); /* Тончайшая жёлтая обводка */
            background: rgba(234, 179, 8, 0.06); /* Полупрозрачный жёлтый фон */
            border-radius: 6px; /* Скруглённые углы */
            padding: 4px 8px; /* Минимальные отступы внутри */
            display: flex; /* Flex для вертикального содержимого */
            flex-direction: column; /* Текст идёт вниз */
            gap: 2px; /* Нет промежутков (для однострочных текстов) */
            flex-shrink: 0; /* Не сжимается */
        }

        /* Текст внутри плашки с пробой */
        .route-brake-text {
            color: #eab308; /* Мягкий жёлто-оранжевый цвет */
            font-size: 12px; /* Маленький шрифт */
            font-weight: 600; /* Полужирный */
            white-space: nowrap; /* Не переносит текст */
        }

        /* ===== МАРШРУТЫ: Нижняя секция — в пути, пробег, оборот ===== */
        .route-card-bottom {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #8393af;
        }

        .route-card-bottom > span:first-child {
            justify-self: start;
            white-space: nowrap;
        }

        .route-mileage {
            justify-self: center;
            white-space: nowrap;
        }

        .route-card-bottom > span:last-child {
            justify-self: end;
            text-align: right;
            white-space: nowrap;
        }

        /* ===== МАРШРУТЫ: Сводка по маршруту ===== */
        .route-summary {
            background: #141b27;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 16px 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 4px;
            animation: fadeInScale 0.3s ease-out;
        }

        .route-summary-title {
            font-size: 18px;
            font-weight: 600;
            color: #a8b8d8;
            text-align: center;
            margin-bottom: 4px;
        }

        .route-summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            background: #1a2333;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 14px;
        }

        .route-summary-row span:first-child {
            color: #8393af;
        }

        .route-summary-row span:last-child {
            color: #e2e8f0;
            font-weight: 600;
            white-space: nowrap;
        }

        .shift-reset-wrap {
            display: none;
            justify-content: center;
            width: 100%;
            margin-top: 20px;
            margin-bottom: 8px;
        }

        .shift-reset-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 140px;
            height: 44px;
            padding: 0;
            border: none;
            border-radius: 999px;
            background: #178038;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .shift-reset-btn:hover {
            background: #1f8440;
            transform: translateY(-1px);
        }

        .shift-reset-btn:active {
            background: #0f5a2c;
            transform: translateY(0);
        }

        .shift-reset-btn:focus-visible {
            outline: 2px solid rgba(29, 167, 69, 0.45);
            outline-offset: 2px;
        }

        .shift-reset-glyph {
            color: #ffffff;
            font-size: 30px;
            font-weight: 800;
            line-height: 1;
            display: block;
            -webkit-text-stroke: 0.35px #ffffff;
        }

        .shift-confirm-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(4px);
        }

        .shift-confirm-overlay.is-open {
            display: flex;
        }

        .shift-confirm-box {
            width: 100%;
            max-width: 320px;
            background: #141b27;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            padding: 20px 18px 16px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
        }

        .shift-confirm-text {
            margin: 0 0 18px;
            font-size: 16px;
            font-weight: 500;
            line-height: 1.45;
            color: #f4f7ff;
            text-align: center;
        }

        .shift-confirm-actions {
            display: flex;
            gap: 10px;
        }

        .shift-confirm-btn {
            flex: 1;
            border: none;
            border-radius: 10px;
            padding: 11px 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .shift-confirm-btn--muted {
            background: #252d3a;
            color: #c4d1e8;
        }

        .shift-confirm-btn--muted:hover {
            background: #2f3848;
        }

        .shift-confirm-btn--ok {
            background: #178038;
            color: #ffffff;
        }

        .shift-confirm-btn--ok:hover {
            background: #1f8440;
        }

        /* ===== РАСПИСАНИЕ: Контейнер с вертикальной шкалой времени ===== */
        .timeline {
            position: relative;
            padding-left: 0;
            --km-marker-width: 44px;
            --km-marker-gap: 10px;
            --timeline-left: calc(var(--km-marker-width) / 2);
            --station-fill: #141b27;
            --station-stroke: rgba(255, 255, 255, 0.05);
            --station-brakes-fill: linear-gradient(135deg, #30291d, #171925);
            --station-brakes-stroke: #47371b;
            --station-brakes-badge-fill: #3d3018;
            --station-brakes-badge-stroke: #5c4a28;
            --station-brakes-badge-text: #fbbf24;
            --station-active-stroke: #178038;
            --station-active-glow: 0 0 12px #145a2e;
        }

        .timeline-line {
            position: absolute;
            left: var(--timeline-left);
            top: 24px;
            bottom: 24px;
            width: 2px;
            background: rgba(255, 255, 255, 0.08);
        }

        .station-node {
            position: relative;
            padding-left: calc(var(--km-marker-width) + var(--km-marker-gap));
            margin-bottom: 14px;
            width: 100%;
        }

        .station-card {
            background: var(--station-fill);
            border: 1px solid var(--station-stroke);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
        }

        .station-card.has-brakes {
            background: var(--station-brakes-fill);
            border-color: var(--station-brakes-stroke);
        }

        .station-node.active .station-card {
            border-color: var(--station-active-stroke);
            box-shadow: var(--station-active-glow);
        }

        /* ===== РАСПИСАНИЕ: Верхняя строка карточки — название станции и время ===== */
        .card-row-top {
            display: flex; /* Flex для горизонтального расположения */
            justify-content: space-between; /* Название слева, время справа */
            align-items: center; /* Выравнивание по центру вертикали */
            gap: 12px; /* Расстояние между ними */
            width: 100%; /* Займёт всю ширину */
        }

        /* Название станции */
        .station-name {
            font-size: 16px; /* Размер шрифта */
            font-weight: 600; /* Полужирный */
            color: #f4f7ff; /* Светлый цвет */
            white-space: nowrap; /* Не переносит текст */
            overflow: hidden; /* Скрывает переполнение */
            text-overflow: ellipsis; /* Добавляет многоточие */
            flex: 1; /* Займёт оставшееся место */
            min-width: 0; /* Позволяет сжиматься ниже минимума */
        }

        /* Время остановки (вверху справа) */
        .time-badge {
            color: #ffffff;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.5px;
            flex-shrink: 0;
            white-space: nowrap;
            background: transparent;
            padding: 0;
        }

        /* ===== РАСПИСАНИЕ: Нижняя строка карточки — пробы тормозов ===== */
        .card-row-bottom {
            border-top: 1px dashed rgba(255, 255, 255, 0.06);
            padding-top: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: flex-start;
        }

        /* Квадратик км/пикет — по высоте как карточка станции */
        .station-dot {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: var(--km-marker-width);
            min-width: var(--km-marker-width);
            min-height: 48px;
            height: auto;
            border-radius: 12px;
            background: var(--station-fill);
            border: 1px solid var(--station-stroke);
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            padding: 8px 4px;
            transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
        }

        .station-dot::after {
            content: attr(data-km);
            color: #f4f7ff;
            font-size: 13px;
            font-weight: 700;
            line-height: 1.15;
            white-space: nowrap;
            text-align: center;
        }

        .station-node.has-brakes .station-dot {
            background: var(--station-brakes-fill);
            border-color: var(--station-brakes-stroke);
            box-shadow: 0 0 14px #f59e0b;
        }

        .station-node.has-brakes .station-dot::after {
            color: #fbbf24;
        }

        .station-node.active .station-dot {
            border-color: var(--station-active-stroke);
            box-shadow: var(--station-active-glow);
        }

        .station-node.active.has-brakes .station-dot::after {
            color: #ffffff;
        }

        /* ===== РАСПИСАНИЕ: Индикатор загрузки ===== */
        .loader {
            display: none; /* По умолчанию скрыт */
            text-align: center; /* Выравнивание по центру */
            color: #9db0cf; /* Серый цвет текста */
            font-size: 14px; /* Размер шрифта */
            margin: 16px 0; /* Отступы сверху и снизу */
            position: relative; /* Базис для позиционирования */
            height: 60px; /* Фиксированная высота */
            align-items: center; /* Выравнивание по центру вертикали */
            justify-content: center; /* Выравнивание по центру горизонтали */
            flex-direction: column; /* Flex для вертикального расположения */
            gap: 12px; /* Расстояние между элементами */
        }

        /* Анимирующееся колесо загрузки */
        .loader::before {
            content: ''; /* Псевдоэлемент */
            display: block; /* Блочный элемент */
            box-sizing: border-box; /* Размер включает границу */
            flex-shrink: 0; /* Не сжимается */
            width: 24px; /* Диаметр */
            height: 24px; /* Диаметр */
            border: 3px solid rgba(23, 128, 56, 0.2); /* Приглушённая зелёная граница */
            border-top-color: #178038; /* Ярко-зелёный верх — вращающаяся часть */
            border-radius: 50%; /* Круглая форма */
            animation: spin 0.8s linear infinite; /* Вращение */
        }

        /* Анимация вращения */
        @keyframes spin {
            to { transform: rotate(360deg); } /* Полный оборот */
        }


        @media (max-width: 430px) {
            .phone-screen {
                min-height: auto;
                padding: 20px 12px;
            }

            .tabs-nav {
                flex-wrap: wrap;
                gap: 8px;
            }

            .tab-btn {
                width: 100%;
                border-radius: 14px;
            }

            .schedule-search-btn {
                width: 100%;
            }

            .route-card {
                padding: 0; /* Вычистили старый надувающий отступ */
            }

            .route-card-section {
                padding: 6px 12px 6px 18px; /* Сделали экстремально узко по вертикали на мобилках */
            }

            .timeline {
                --km-marker-width: 40px;
                --km-marker-gap: 8px;
            }
        }
    </style>
</head>
<body>

<div class="phone-screen">
    <div class="tabs-nav">
        <button class="tab-btn active" data-tab="tab-route" onclick="switchTab('tab-route', this)">Маршрут</button>
        <button class="tab-btn" data-tab="tab-schedule" onclick="switchTab('tab-schedule', this)">Расписание</button>
    </div>

    <div id="tab-route" class="tab-content active">
        <div class="shift-date-card">
            <div class="shift-date-main">
                <label class="shift-date-picker" id="datePickerLabel" title="Выбрать дату смены">
                    <span id="dateDisplayText" class="shift-date-display"></span>
                    <input type="date" id="dateInput" class="shift-date-input" aria-label="Дата смены">
                    <span class="shift-date-calendar-icon" aria-hidden="true">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="18" rx="2"></rect>
                            <path d="M16 2v4M8 2v4M3 10h18"></path>
                        </svg>
                    </span>
                </label>
            </div>
            <div class="shift-date-night">
                <span class="shift-date-night-label">Ночь</span>
                <label class="night-switch">
                    <input type="checkbox" id="nightMode">
                    <span class="night-switch-slider"></span>
                </label>
            </div>
        </div>
        <div class="trains-dynamic">
            <div id="trainsList" class="trains-list"></div>
            <button type="button" id="addTrainBtn" class="add-train-btn">+ Добавить поезда</button>
        </div>
        <div class="trains-submit">
            <button class="action-btn" onclick="getRouteData()">Показать маршруты</button>
        </div>
        
        <div id="routeLoader" class="loader">Получение данных...</div>
        
        <div id="routeGrid" class="route-grid" style="display: none;"></div>
        <div id="shiftResetWrap" class="shift-reset-wrap">
            <button type="button" id="shiftResetBtn" class="shift-reset-btn" aria-label="Очистить данные смены" onclick="requestShiftReset(event)">
                <span class="shift-reset-glyph" aria-hidden="true">↻</span>
            </button>
        </div>
    </div>

    <div id="shiftResetConfirm" class="shift-confirm-overlay" aria-hidden="true" role="alertdialog" aria-labelledby="shiftConfirmText" aria-modal="true">
        <div class="shift-confirm-box">
            <p id="shiftConfirmText" class="shift-confirm-text">Очистить все данные текущей смены?</p>
            <div class="shift-confirm-actions">
                <button type="button" id="shiftConfirmCancel" class="shift-confirm-btn shift-confirm-btn--muted">Отмена</button>
                <button type="button" id="shiftConfirmOk" class="shift-confirm-btn shift-confirm-btn--ok">ОК</button>
            </div>
        </div>
    </div>

    <div id="tab-schedule" class="tab-content">
        <div class="schedule-search">
            <div class="schedule-search-field train-field train-field--has-clear">
                <input type="text" id="singleTrain" class="train-input" placeholder="Поезд (например 6618)" maxlength="4" inputmode="numeric" autocomplete="off">
                <button type="button" id="singleTrainClear" class="train-field-clear" aria-label="Очистить номер поезда">&times;</button>
            </div>
            <button type="button" class="action-btn schedule-search-btn" onclick="getScheduleData()">Найти нитку</button>
        </div>
        <p class="schedule-date-hint" id="scheduleDateHint"></p>

        <p id="scheduleEmpty" class="schedule-empty">Введите номер поезда</p>

        <div id="scheduleHeader" style="display:none;"></div>
        <div id="scheduleLoader" class="loader schedule-loader">Сборка нитки...</div>

        <div id="scheduleResults" class="timeline schedule-results-wrap" style="display: none;">
            <div class="timeline-line"></div>
            <div id="stationsList"></div>
        </div>
    </div>
</div>

<script>
    const DASH_CHAR = String.fromCharCode(45);
    const API_KEY = '905d4044' + DASH_CHAR + '2b7e' + DASH_CHAR + '45ca' + DASH_CHAR + 'b10c' + DASH_CHAR + 'f0e907c15f00';
    const API_BASE = 'https://api.rasp.yandex.net/v3.0';
    const MY_CLOUDFLARE_PROXY = 'https://late-shape-356d.maksbarybin9458.workers.dev/';
    const ANCHOR_STATION = 's2000002';

    let stationScheduleCache = { date: null, data: null };
    let trainThreadsCache = {};
    let sprDataCache = null;

    const MAX_TRAIN_SLOTS = 6;
    const DEFAULT_TRAIN_SLOTS = 2;
    const TRAIN_PLACEHOLDER_EXAMPLES = ['6675', '6676', '6677', '6678', '6679', '6680'];

    function getTrainPlaceholder(index) {
        const n = index + 1;
        const example = TRAIN_PLACEHOLDER_EXAMPLES[index];
        return example ? `Поезд ${n} (${example})` : `Поезд ${n}`;
    }

    function createTrainInputElement(index, value = '') {
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'train-input';
        input.maxLength = 4;
        input.inputMode = 'numeric';
        input.placeholder = getTrainPlaceholder(index);
        input.value = value;
        return input;
    }

    function createTrainFieldElement(index, value = '') {
        const field = document.createElement('div');
        field.className = 'train-field train-field--has-clear';
        field.appendChild(createTrainInputElement(index, value));

        const clearBtn = document.createElement('button');
        clearBtn.type = 'button';
        clearBtn.className = 'train-field-clear';
        clearBtn.setAttribute('aria-label', 'Удалить поле поезда');
        clearBtn.textContent = '\u00d7';
        clearBtn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            removeTrainSlotAt(index);
        });
        field.appendChild(clearBtn);

        return field;
    }

    function removeTrainSlotAt(index) {
        const inputs = document.querySelectorAll('#trainsList .train-input');
        const values = Array.from(inputs).map(input => input.value);
        if (index < 0 || index >= values.length) return;

        if (values.length > DEFAULT_TRAIN_SLOTS) {
            values.splice(index, 1);
        } else {
            values[index] = '';
        }
        renderTrainInputs(values);
    }

    function renderTrainInputs(savedValues = []) {
        const list = document.getElementById('trainsList');
        const addBtn = document.getElementById('addTrainBtn');
        if (!list || !addBtn) return;

        const slotCount = Math.min(
            MAX_TRAIN_SLOTS,
            Math.max(DEFAULT_TRAIN_SLOTS, savedValues.length)
        );

        list.innerHTML = '';
        for (let i = 0; i < slotCount; i++) {
            list.appendChild(createTrainFieldElement(i, savedValues[i] || ''));
        }

        addBtn.style.display = slotCount >= MAX_TRAIN_SLOTS ? 'none' : 'block';
        addBtn.disabled = slotCount >= MAX_TRAIN_SLOTS;
    }

    function getTrainNumbersFromDom() {
        return Array.from(document.querySelectorAll('#trainsList .train-input'))
            .map(input => input.value.trim())
            .filter(Boolean);
    }

    function addTrainSlot() {
        const inputs = document.querySelectorAll('#trainsList .train-input');
        if (inputs.length >= MAX_TRAIN_SLOTS) return;

        const values = Array.from(inputs).map(input => input.value);
        values.push('');
        renderTrainInputs(values);

        const list = document.getElementById('trainsList');
        list?.lastElementChild?.querySelector('.train-input')?.focus();
    }

    document.addEventListener('DOMContentLoaded', () => {
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        const dateInput = document.getElementById('dateInput');
        const savedDate = localStorage.getItem('selectedDate');
        const initialIso = savedDate || `${yyyy}${DASH_CHAR}${mm}${DASH_CHAR}${dd}`;
        setSelectedDateIso(initialIso);

        const datePickerLabel = document.getElementById('datePickerLabel');
        const openDatePicker = () => {
            if (typeof dateInput.showPicker === 'function') {
                try {
                    dateInput.showPicker();
                    return;
                } catch (err) {
                    /* showPicker может быть заблокирован без user gesture */
                }
            }
            dateInput.focus({ preventScroll: true });
            dateInput.click();
        };

        datePickerLabel?.addEventListener('click', (e) => {
            e.preventDefault();
            openDatePicker();
        });

        dateInput.addEventListener('change', () => {
            setSelectedDateIso(dateInput.value);
            refreshRoutesIfVisible();
            refreshScheduleIfVisible();
        });

        dateInput.addEventListener('input', () => {
            updateDateDisplayText(dateInput.value);
            updateScheduleDateHint();
        });

        updateScheduleDateHint();

        document.getElementById('singleTrainClear')?.addEventListener('click', (e) => {
            e.preventDefault();
            const input = document.getElementById('singleTrain');
            if (input) {
                input.value = '';
                input.focus();
            }
            localStorage.removeItem('lastSingleTrain');
            resetScheduleResults();
        });

        document.getElementById('singleTrain')?.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                getScheduleData();
            }
        });

        updateScheduleEmptyState();

        const nightModeInput = document.getElementById('nightMode');
        if (localStorage.getItem('nightMode') === '1') {
            nightModeInput.checked = true;
        }
        nightModeInput.addEventListener('change', () => {
            localStorage.setItem('nightMode', nightModeInput.checked ? '1' : '0');
            updateScheduleDateHint();
            refreshRoutesIfVisible();
            refreshScheduleIfVisible();
        });

        document.getElementById('addTrainBtn')?.addEventListener('click', addTrainSlot);

        document.getElementById('shiftResetBtn')?.addEventListener('click', requestShiftReset);

        const shiftConfirmOverlay = document.getElementById('shiftResetConfirm');
        document.getElementById('shiftConfirmCancel')?.addEventListener('click', closeShiftResetConfirm);
        document.getElementById('shiftConfirmOk')?.addEventListener('click', () => {
            closeShiftResetConfirm();
            performShiftReset();
        });
        shiftConfirmOverlay?.addEventListener('click', (e) => {
            if (e.target === shiftConfirmOverlay) closeShiftResetConfirm();
        });

        const savedTrains = parseJSON(localStorage.getItem('trainNumbers'), []);
        renderTrainInputs(Array.isArray(savedTrains) ? savedTrains : []);

        // Восстанавливаем сохраненный номер одиночного поезда
        const lastSingle = localStorage.getItem('lastSingleTrain');
        if (lastSingle) {
            const singleInput = document.getElementById('singleTrain');
            if (singleInput) singleInput.value = lastSingle;
        }

        // Восстанавливаем сохраненное суточное расписание вокзала
        const localStationCache = localStorage.getItem('stationScheduleCache');
        if (localStationCache) {
            stationScheduleCache = parseJSON(localStationCache, stationScheduleCache);
        }

        // Восстанавливаем сохраненные детальные маршруты поездов
        const localThreadsCache = localStorage.getItem('trainThreadsCache');
        if (localThreadsCache) {
            trainThreadsCache = parseJSON(localThreadsCache, trainThreadsCache);
        }

        // Восстанавливаем активную вкладку прошлой сессии
        const activeTab = localStorage.getItem('activeTab') || 'tab-route';
        const activeBtn = document.querySelector(`.tab-btn[data-tab="${activeTab}"]`);
        if (activeBtn) {
            switchTab(activeTab, activeBtn);
        }

        // Загружаем справочник тормозов при старте
        fetch('spr.json')
            .then(res => {
                if (!res.ok) throw new Error(`HTTP ошибка: ${res.status}`);
                return res.text(); // Получаем текст, чтобы безопасно проверить содержимое
            })
            .then(text => {
                if (!text.trim()) throw new Error('Файл пуст');
                sprDataCache = JSON.parse(text);
                console.log("Справочник успешно загружен:", sprDataCache); // Проверка в консоли
            })
            .catch(err => {
                console.error('Связь со справочником утеряна:', err);
                if (err.name === 'SyntaxError' || err.message === 'Файл пуст') {
                    alert('Файл spr.json пуст или содержит ошибку (невалидный JSON). Открой spr.json, вставь туда данные и обязательно сохрани (Ctrl+S)!');
                } else {
                    alert('Не удалось загрузить spr.json. Если ты открыл файл просто двойным кликом, браузер блокирует загрузку локальных файлов. Используй Live Server.');
                }
            })
            .finally(() => {
                const hasTrains = getTrainNumbersFromDom().length > 0;
                if (hasTrains && activeTab === 'tab-route') {
                    getRouteData();
                } else if (lastSingle && activeTab === 'tab-schedule') {
                    getScheduleData();
                }
            });
    });

    // Ограничение на 4 цифры и автоматический переход к следующему/предыдущему полю
    document.addEventListener('input', function(e) {
        const target = e.target;
        if (target.classList.contains('train-input')) {
            target.value = target.value.replace(/[^\d]/g, ''); // удаляем всё, кроме цифр
            
            if (target.value.length === 4) {
                const inputs = Array.from(document.querySelectorAll('#trainsList .train-input'));
                const currentIndex = inputs.indexOf(target);
                if (currentIndex !== -1 && currentIndex < inputs.length - 1) {
                    inputs[currentIndex + 1].focus();
                }
            }
        }
    });

    document.addEventListener('keydown', function(e) {
        const target = e.target;
        if (target.classList.contains('train-input') && e.key === 'Backspace' && target.value.length === 0) {
            const inputs = Array.from(document.querySelectorAll('#trainsList .train-input'));
            const currentIndex = inputs.indexOf(target);
            if (currentIndex > 0) {
                inputs[currentIndex - 1].focus();
            }
        }
    });

    const MONTHS_RU_GENITIVE = [
        'Января', 'Февраля', 'Марта', 'Апреля', 'Мая', 'Июня',
        'Июля', 'Августа', 'Сентября', 'Октября', 'Ноября', 'Декабря'
    ];

    function formatShiftDateDisplay(iso) {
        if (!iso) return '';
        const parts = iso.split(DASH_CHAR).map(Number);
        if (parts.length !== 3 || parts.some(n => Number.isNaN(n))) return '';
        const [year, month, day] = parts;
        const monthLabel = (MONTHS_RU_GENITIVE[month - 1] || '').toLowerCase();
        return `${day} ${monthLabel} ${year}`;
    }

    function updateDateDisplayText(iso) {
        const el = document.getElementById('dateDisplayText');
        if (el) el.textContent = formatShiftDateDisplay(iso);
    }

    function updateScheduleDateHint() {
        const el = document.getElementById('scheduleDateHint');
        if (!el) return;
        const label = formatShiftDateDisplay(getSelectedDate());
        if (!label) {
            el.textContent = '';
            return;
        }
        el.textContent = isNightMode() ? `Дата смены: ${label} · ночная смена` : `Дата смены: ${label}`;
    }

    function updateScheduleEmptyState() {
        const empty = document.getElementById('scheduleEmpty');
        const results = document.getElementById('scheduleResults');
        const header = document.getElementById('scheduleHeader');
        const loader = document.getElementById('scheduleLoader');
        if (!empty) return;
        const loading = loader && loader.style.display === 'flex';
        const hasResults = results && results.style.display !== 'none'
            && header && header.style.display !== 'none';
        empty.style.display = (!loading && !hasResults) ? 'block' : 'none';
    }

    function escapeHtml(str) {
        if (str == null) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function formatStopsCount(count) {
        const n = Number(count) || 0;
        const mod10 = n % 10;
        const mod100 = n % 100;
        if (mod10 === 1 && mod100 !== 11) return `${n} остановка`;
        if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return `${n} остановки`;
        return `${n} остановок`;
    }

    function getSelectedDate() {
        return document.getElementById('dateInput').value;
    }

    function setSelectedDateIso(iso) {
        const dateInput = document.getElementById('dateInput');
        if (!iso || !dateInput) return;
        dateInput.value = iso;
        updateDateDisplayText(iso);
        updateScheduleDateHint();
        localStorage.setItem('selectedDate', iso);
    }

    function refreshRoutesIfVisible() {
        const grid = document.getElementById('routeGrid');
        if (grid && grid.style.display !== 'none' && grid.innerHTML.trim()) {
            getRouteData();
        }
    }

    function refreshScheduleIfVisible() {
        const results = document.getElementById('scheduleResults');
        const header = document.getElementById('scheduleHeader');
        const input = document.getElementById('singleTrain')?.value.trim();
        if (!input) return;
        if (results?.style.display !== 'none' && header?.style.display !== 'none') {
            getScheduleData();
        }
    }

    function resetScheduleResults() {
        const results = document.getElementById('scheduleResults');
        const header = document.getElementById('scheduleHeader');
        const list = document.getElementById('stationsList');
        if (results) results.style.display = 'none';
        if (header) {

    function requestShiftReset(e) {

    function isNightMode() {
        return document.getElementById('nightMode')?.checked === true;
    }

    function addDaysToDateStr(dateStr, days) {
        if (!dateStr) return dateStr;
        const parts = dateStr.split(DASH_CHAR).map(Number);
        if (parts.length !== 3) return dateStr;
        const d = new Date(parts[0], parts[1] - 1, parts[2] + days);
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        return `${yyyy}${DASH_CHAR}${mm}${DASH_CHAR}${dd}`;
    }

    const MORNING_SHIFT_END_MIN = 16 * 60;

    function isMorningNextShiftDeparture(departureTime) {
        const mins = parseTimeToMinutes(departureTime);
        if (mins === null) return false;
        return mins < MORNING_SHIFT_END_MIN;
    }

    function resolveEffectiveDate(baseDate, departureTime) {
        if (!isNightMode() || !departureTime) return baseDate;
        if (isMorningNextShiftDeparture(departureTime)) {
            return addDaysToDateStr(baseDate, 1);
        }
        return baseDate;
    }

    function tripCrossesMidnight(departure, arrival) {
        const depMin = parseTimeToMinutes(departure);
        const arrMin = parseTimeToMinutes(arrival);
        if (depMin === null || arrMin === null) return false;
        return arrMin < depMin;
    }

    function formatTrainCardDate(scheduleDateIso, departure, arrival) {
        if (!scheduleDateIso) return '—';
        const parts = scheduleDateIso.split(DASH_CHAR);
        if (parts.length !== 3) return '—';
        const day = parseInt(parts[2], 10);
        const month = parseInt(parts[1], 10);
        if (!day || month < 1 || month > 12) return '—';

        if (tripCrossesMidnight(departure, arrival)) {
            const nextIso = addDaysToDateStr(scheduleDateIso, 1);
            const nextDay = parseInt(nextIso.split(DASH_CHAR)[2], 10);
            return `${day}${DASH_CHAR}${nextDay} ${MONTHS_RU_GENITIVE[month - 1]}`;
        }
        return `${day} ${MONTHS_RU_GENITIVE[month - 1]}`;
    }

    function getTime(tStr) {
        if (!tStr) return '...';
        const m = tStr.match(/(\d{2}:\d{2})/);
        return m ? m[1] : tStr;
    }

    function formatMinutesToHoursAndMinutes(totalMinutes) {
        if (totalMinutes === null || totalMinutes === '...' || isNaN(totalMinutes) || totalMinutes < 0) {
            return '...';
        }
        const mins = parseInt(totalMinutes);
        if (mins >= 60) {
            const h = Math.floor(mins / 60);
            const m = mins % 60;
            return m > 0 ? `${h} ч ${m} мин` : `${h} ч`;
        } else {
            return `${mins} мин`;
        }
    }

    function parseTimeToMinutes(timeString) {
        if (!timeString || timeString === '...') return null;
        const [hours, minutes] = timeString.split(':').map(Number);
        return Number.isFinite(hours) && Number.isFinite(minutes) ? hours * 60 + minutes : null;
    }

    function normalizeStationName(name) {
        return String(name || '')
            .trim()
            .replace(/\s+/g, ' ')
            .toLowerCase();
    }

    function normalizeStationKey(name) {
        return normalizeStationName(name)
            .replace(/\u0451/g, '\u0435') /* ё → е: Яндекс и spr часто пишут по-разному */
            .replace(/[\u2010-\u2015\u2212\uFE58\uFE63\uFF0D]/g, '-') /* длинное тире → дефис */
            .replace(/[^a-zа-яё0-9 \-()]/g, '')
            .replace(/\s+/g, ' ')
            .trim();
    }

    function applyStationAliases(searchKey) {
        let key = searchKey;
        for (const [yandexName, myName] of Object.entries(ALIASES)) {
            if (key.includes(normalizeStationKey(yandexName))) {
                key = normalizeStationKey(myName);
                break;
            }
        }
        return key;
    }

    function stationSearchKeys(stationTitle) {
        const primary = applyStationAliases(normalizeStationKey(stationTitle));
        const keys = [primary];
        const noParens = primary.replace(/\s*\([^)]*\)\s*/g, ' ').replace(/\s+/g, ' ').trim();
        if (noParens && noParens !== primary) keys.push(noParens);
        return keys;
    }

    function findStationPathMatch(stationTitle) {
        if (!sprDataCache?.stations_path) return null;
        for (const key of stationSearchKeys(stationTitle)) {
            const hit = sprDataCache.stations_path.find(s => normalizeStationKey(s.station) === key);
            if (hit) return hit;
        }
        return null;
    }

    function findBrakeMatch(stationTitle, direction) {
        if (!sprDataCache?.brakes) return null;
        for (const key of stationSearchKeys(stationTitle)) {
            const hit = sprDataCache.brakes[direction]?.find(b => normalizeStationKey(b.station) === key)
                || sprDataCache.brakes.dead_ends?.find(b => normalizeStationKey(b.station) === key);
            if (hit) return hit;
        }
        return null;
    }

    function parseJSON(value, fallback = null) {
        try {
            return JSON.parse(value);
        } catch (e) {
            return fallback;
        }
    }

    function stationChainage(stationTitle) {
        const match = findStationPathMatch(stationTitle);
        if (!match) return null;
        return match.km + match.piket / 10;
    }

    function calcRouteMileageKm(firstTitle, lastTitle) {
        const start = stationChainage(firstTitle);
        const end = stationChainage(lastTitle);
        if (start === null || end === null) return null;
        return Math.round(Math.abs(end - start));
    }

    function calcTurnaroundMileageKm(endTitle, nextStartTitle) {
        const endPos = stationChainage(endTitle);
        const startPos = stationChainage(nextStartTitle);
        if (endPos === null || startPos === null) return null;
        return Math.round(Math.abs(startPos - endPos));
    }

    function formatMileage(km) {
        if (km === null || km === undefined || isNaN(km)) return '—';
        return `${km} км`;
    }

    function formatTotalMinutes(minutes) {
        if (minutes === null || minutes === undefined || isNaN(minutes) || minutes <= 0) {
            return '0 мин';
        }
        return formatMinutesToHoursAndMinutes(minutes);
    }

    function buildRouteSummaryHtml(totals) {

                </div>
                <div class="route${D}summary${D}row">

                </div>
                <div class="route${D}summary${D}row">

                </div>

            </div>
        `;
    }

    // Словарь-спасатель для Яндекса
    const ALIASES = {
        "москва-ярославская": "москва (ярославский вокзал)",
        "москва ярославская": "москва (ярославский вокзал)",
        "ростокино (ярославское направление)": "ростокино",
        "александров-1": "александров",
        "фрязино-пасс": "фрязино (пассажирская)",
        "фрязино-пасс.": "фрязино (пассажирская)"
    };

    async function searchTrainByNumber(trainNumber, scheduleDate) {
        try {
            if (Array.isArray(stationScheduleCache.data) && stationScheduleCache.data.length === 0) {
                stationScheduleCache.data = null;
            }

            const date = scheduleDate || getSelectedDate();
            const cacheKey = date + "_" + trainNumber;
            
            // Если нитка этого поезда уже сохранена в памяти, берем её без интернета
            if (trainThreadsCache[cacheKey]) {
                console.log("Достали маршрут из памяти устройства:", trainNumber);
                return trainThreadsCache[cacheKey];
            }
            
            if (!stationScheduleCache.data || stationScheduleCache.date !== date) {
                const url = `${API_BASE}/schedule/?apikey=${API_KEY}&station=${ANCHOR_STATION}&transport_types=suburban&direction=all&limit=1000&date=${date}&lang=ru_RU`;
                const response = await fetch(`${MY_CLOUDFLARE_PROXY}?url=${encodeURIComponent(url)}`);
                if (!response.ok) {
                    alert(`Ошибка сервера код ${response.status}`);
                    throw new Error(`Ошибка сервера код ${response.status}`);
                }
                const stationData = await response.json();
                if (stationData.error) {
                    alert(stationData.error);
                    throw new Error(stationData.error);
                }
                
                stationScheduleCache.date = date;
                stationScheduleCache.data = stationData.schedule || [];
                // Сохраняем суточное расписание в localStorage
                localStorage.setItem("stationScheduleCache", JSON.stringify(stationScheduleCache));
            }
            
            const targetStr = trainNumber.toString().replace(/\s/g, '').toLowerCase();
            const targetDigits = targetStr.replace(/\D/g, '');
            const trainData = stationScheduleCache.data.find(item => {
                const threadNumber = String(item.thread?.number || '').replace(/\s/g, '').toLowerCase();
                if (!threadNumber) return false;
                if (threadNumber === targetStr) return true;
                if (targetDigits && threadNumber.replace(/\D/g, '') === targetDigits) return true;
                return false;
            });
            
            if (!trainData) return null;
            
            const threadUrl = `${API_BASE}/thread/?apikey=${API_KEY}&uid=${trainData.thread.uid}&lang=ru_RU`;
            const threadResponse = await fetch(`${MY_CLOUDFLARE_PROXY}?url=${encodeURIComponent(threadUrl)}`);
            if (!threadResponse.ok) {
                alert(`Ошибка сервера код ${threadResponse.status}`);
                throw new Error(`Не удалось загрузить детали маршрута: ${threadResponse.status}`);
            }
            const threadData = await threadResponse.json();
            if (threadData.error) {
                alert(threadData.error);
                throw new Error(threadData.error);
            }
            
            const stops = threadData.stops || [];
            if (stops.length === 0) return null;
            
            const first = stops[0];
            const last = stops[stops.length - 1];
            
            const departureTime = getTime(first.departure);
            const arrivalTime = getTime(last.arrival);
            
            let durationMins = null;
            const dMin = parseTimeToMinutes(departureTime);
            const aMin = parseTimeToMinutes(arrivalTime);
            if (dMin !== null && aMin !== null) {
                durationMins = aMin >= dMin ? aMin - dMin : (aMin + 1440) - dMin;
            }
            
            const result = {
                number: trainData.thread.number,
                uid: trainData.thread.uid,
                title: `${first.station.title} ${DASH_CHAR} ${last.station.title}`,
                transport_type: trainData.thread.express_type === 'express' ? 'РЭКС / Экспресс' : 'Пригородный',
                departure: departureTime,
                arrival: arrivalTime,
                duration: durationMins,
                stops: stops,
                stops_text: trainData.stops || 'Со всеми остановками',
                scheduleDate: date
            };
            
            // Записываем полученную нитку поезда в память устройства
            trainThreadsCache[cacheKey] = result;
            localStorage.setItem("trainThreadsCache", JSON.stringify(trainThreadsCache));
            
            return result;
        } catch (error) {
            console.error(error);
            return null;
        }
    }

    async function searchTrainByNumberSmart(trainNumber) {
        const baseDate = getSelectedDate();
        if (!isNightMode()) {
            return searchTrainByNumber(trainNumber, baseDate);
        }

        const trainBase = await searchTrainByNumber(trainNumber, baseDate);
        if (trainBase) {
            const effectiveDate = resolveEffectiveDate(baseDate, trainBase.departure);
            if (effectiveDate !== baseDate) {
                const trainNext = await searchTrainByNumber(trainNumber, effectiveDate);
                if (trainNext) return trainNext;
            }
            return trainBase;
        }

        const nextDate = addDaysToDateStr(baseDate, 1);
        return searchTrainByNumber(trainNumber, nextDate);
    }

    async function getRouteData() {
        const inputs = getTrainNumbersFromDom();

        if (inputs.length === 0) {
            alert('Введите хотя бы один номер поезда.');
            return;
        }

        if (!getSelectedDate()) {
            alert('Укажите дату смены.');
            return;
        }
        
        // Сохраняем номера поездов в localStorage
        localStorage.setItem('trainNumbers', JSON.stringify(inputs));

        const loader = document.getElementById('routeLoader');
        const grid = document.getElementById('routeGrid');

        loader.style.display = 'flex';
        grid.style.display = 'none';
        setShiftResetVisible(false);

        const trainPromises = inputs.map(trainNumber => searchTrainByNumberSmart(trainNumber));
        const allTrainsData = await Promise.all(trainPromises);
        
        const cards = [];
        const totals = {
            travelMinutes: 0,
            turnaroundMinutes: 0,
            trainCount: 0,
            totalMileageKm: 0
        };
        
        for (let i = 0; i < inputs.length; i++) {
            const trainNumber = inputs[i];
            const train = allTrainsData[i];
            
            if (train) {
                totals.trainCount += 1;
                if (train.duration !== null && !isNaN(train.duration)) {
                    totals.travelMinutes += train.duration;
                }

                const firstTitle = train.stops[0]?.station?.title || '';
                const lastTitle = train.stops[train.stops.length - 1]?.station?.title || '';
                const mileageKm = calcRouteMileageKm(firstTitle, lastTitle);
                if (mileageKm !== null) {
                    totals.totalMileageKm += mileageKm;
                }

                let durationHtml = `В пути: ${formatMinutesToHoursAndMinutes(train.duration)}`;
                let turnaroundHtml = '';

                if (i < inputs.length - 1) {
                    const nextTrain = allTrainsData[i + 1];
                    if (nextTrain) {
                        const arrCurrentMinutes = parseTimeToMinutes(train.arrival);
                        const depNextMinutes = parseTimeToMinutes(nextTrain.departure);

                        if (arrCurrentMinutes !== null && depNextMinutes !== null) {
                            let turnaroundMinutes = depNextMinutes - arrCurrentMinutes;
                            if (turnaroundMinutes < 0) {
                                turnaroundMinutes += 1440;
                            }
                            totals.turnaroundMinutes += turnaroundMinutes;
                            turnaroundHtml = `Оборот: ${formatMinutesToHoursAndMinutes(turnaroundMinutes)}`;

                            const nextFirstTitle = nextTrain.stops[0]?.station?.title || '';
                            const turnaroundKm = calcTurnaroundMileageKm(lastTitle, nextFirstTitle);
                            if (turnaroundKm !== null) {
                                totals.totalMileageKm += turnaroundKm;
                                if (turnaroundKm > 0) {
                                    turnaroundHtml += ` · ${formatMileage(turnaroundKm)}`;
                                }
                            }
                        }
                    }
                }
                let currentDirection = 'to_moscow';
                if (firstTitle.toLowerCase().includes('москва')) {
                    currentDirection = 'from_moscow';
                }

                const mileageHtml = formatMileage(mileageKm);
                const cardDateLabel = formatTrainCardDate(train.scheduleDate, train.departure, train.arrival);

                let brakeHtml = '';
                if (sprDataCache) {
                    let startBrakesHtml = '';
                    let endBrakesHtml = '';

                    const startKeys = stationSearchKeys(firstTitle);
                    const startBrakesList = sprDataCache.brakes[currentDirection]?.filter(b =>
                        startKeys.includes(normalizeStationKey(b.station))
                    ) || [];
                    const ptBrake = startBrakesList.find(b => b.type === "PT_1");
                    const eptBrake = startBrakesList.find(b => b.type === "EPT_2");

                    let startTags = [];
                    if (ptBrake) startTags.push(`ПТ ${DASH_CHAR} ${ptBrake.km}пк${ptBrake.piket}`);
                    if (eptBrake) startTags.push(`ЭПТ ${DASH_CHAR} ${eptBrake.km}пк${eptBrake.piket}`);
                    
                    if (startTags.length > 0) {
                        startBrakesHtml = `<div class="route${DASH_CHAR}brake${DASH_CHAR}box">` + startTags.map(t => `<span class="route${DASH_CHAR}brake${DASH_CHAR}text">${t}</span>`).join('') + `</div>`;
                    }

                    const endKeys = stationSearchKeys(lastTitle);
                    const deadEndMatch = sprDataCache.brakes.dead_ends?.find(b =>
                        endKeys.includes(normalizeStationKey(b.station))
                    );
                    if (deadEndMatch) {
                        const trackInfo = deadEndMatch.track ? ` (${deadEndMatch.track})` : '';
                        endBrakesHtml = `<div class="route${DASH_CHAR}brake${DASH_CHAR}box"><span class="route${DASH_CHAR}brake${DASH_CHAR}text">Тупик ${DASH_CHAR} ${deadEndMatch.km}пк${deadEndMatch.piket}${trackInfo}</span></div>`;
                    }

                    if (startBrakesHtml || endBrakesHtml) {
                        brakeHtml = `<div class="route${DASH_CHAR}tags${DASH_CHAR}container">${startBrakesHtml}${endBrakesHtml}</div>`;
                    }
                }

                cards.push(`
                    <div class="route-card clickable" data-uid="${train.uid}" data-number="${train.number}" onclick="viewTrainSchedule(this.dataset.uid, this.dataset.number)">
                        <div class="route-card-section route-card-top">
                            <div class="route-card-title">${train.title}</div>
                            <div class="route-card-subtitle">
                                <span>Поезд ${train.number}</span>
                                <span>${train.stops_text}</span>
                            </div>
                        </div>
                        <div class="route-card-section route-card-middle">
                            <div class="route-card-middle-head">
                                <div class="route-time">${train.departure} ${DASH_CHAR} ${train.arrival}</div>
                                <div class="route-date">${cardDateLabel}</div>
                            </div>
                            ${brakeHtml}
                        </div>
                        <div class="route-card-section route-card-bottom">
                            <span>${durationHtml}</span>
                            <span class="route-mileage">${mileageHtml}</span>
                            <span>${turnaroundHtml}</span>
                        </div>
                    </div>
                `);
            } else {
                cards.push(`
                    <div class="route-card" style="opacity: 0.5;">
                        <div class="route-card-section route-card-top">
                            <div class="route-card-title" style="color: #ff6b6b;">Рейс не найден</div>
                            <div class="route-card-subtitle">
                                <span>Поезд ${trainNumber}</span>
                            </div>
                        </div>
                    </div>
                `);
            }
        }

        if (totals.trainCount > 0) {
            cards.push(buildRouteSummaryHtml(totals));
        }

        loader.style.display = 'none';
        grid.innerHTML = cards.join('');
        grid.style.display = 'flex';
        setShiftResetVisible(totals.trainCount > 0);
    }

    function findClosestStationIndex(stops, selectedDate) {
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        const todayStr = `${yyyy}${DASH_CHAR}${mm}${DASH_CHAR}${dd}`;

        // Если выбран не сегодняшний день, не подсвечиваем станцию
        if (selectedDate && selectedDate !== todayStr) return -1;

        const currentMinutes = today.getHours() * 60 + today.getMinutes();
        let closestIndex = 0;
        let closestDiff = Infinity;

        for (let i = 0; i < stops.length; i++) {
            const stop = stops[i];
            const arr = parseTimeToMinutes(getTime(stop.arrival));
            const dep = parseTimeToMinutes(getTime(stop.departure));
            
            if (arr !== null && dep !== null && currentMinutes >= arr && currentMinutes <= dep) {
                return i;
            }

            const markerTime = dep !== null ? dep : arr;
            if (markerTime === null) continue;

            // Корректный расчет разницы с учетом перехода через полночь (1440 минут)
            let diff = Math.abs(currentMinutes - markerTime);
            if (diff > 720) {
                diff = 1440 - diff;
            }

            if (diff < closestDiff) {
                closestDiff = diff;
                closestIndex = i;
            }
        }
        return closestIndex;
    }

    function renderTimelineFromData(stops, trainNumber, selectedDate) {
        if (!stops || stops.length === 0) {
            resetScheduleResults();
            return;
        }

        const D = String.fromCharCode(45);
        const results = document.getElementById('scheduleResults');
        const header = document.getElementById('scheduleHeader');
        const list = document.getElementById('stationsList');

        const first = stops[0];
        const last = stops[stops.length - 1];
        const routeTitle = `${first.station?.title || 'Станция'} → ${last.station?.title || 'Станция'}`;
        const stopsLabel = formatStopsCount(stops.length);

        header.innerHTML = `
            <div class="route-card schedule-route-card">
                <div class="route-card-section route-card-top">
                    <div class="route-card-title">${escapeHtml(routeTitle)}</div>
                    <div class="route-card-subtitle">
                        <span>Поезд ${escapeHtml(trainNumber)}</span>
                        <span>${escapeHtml(stopsLabel)}</span>
                    </div>
                </div>
            </div>`;
        header.style.display = 'block';

        const activeIndex = findClosestStationIndex(stops, selectedDate);

        const firstTitle = (first.station?.title || '').toLowerCase();
        
        // Поиск направления: если первая станция Москва, то едем из нее, иначе на нее
        let currentDirection = 'to_moscow'; 
        if (firstTitle.includes('москва')) {
            currentDirection = 'from_moscow';
        }

        list.innerHTML = stops.map((stop, index) => {
            const arrivalTime = getTime(stop.arrival);
            const departureTime = getTime(stop.departure);
            const isActive = index === activeIndex && activeIndex !== -1;
            
            const isFirst = index === 0;
            const isLast = index === stops.length - 1;
            const isTerminal = isFirst || isLast;
            
            let timeText = '';
            if (isFirst) {
                timeText = departureTime;
            } else if (isLast) {
                timeText = arrivalTime;
            } else {
                timeText = `${arrivalTime} ${D} ${departureTime}`;
            }

            let brakeHtml = '';
            let hasBrakes = false;
            let kmText = ''; // Сюда запишем наш километраж 4.5
            
            if (sprDataCache) {
                const stationTitle = stop.station?.title || '';
                const searchKeys = stationSearchKeys(stationTitle);

                const stationPathMatch = findStationPathMatch(stationTitle);
                
                if (stationPathMatch) {
                    kmText = `${stationPathMatch.km}.${stationPathMatch.piket}`;
                } else {
                    const anyBrakeMatch = findBrakeMatch(stationTitle, currentDirection);
                    if (anyBrakeMatch) {
                        kmText = `${anyBrakeMatch.km}.${anyBrakeMatch.piket}`;
                    }
                }

                let tags = [];

                // Жесткая логика: распределение тормозов по типу конечных станций
                if (isFirst) {
                    const stationBrakes = sprDataCache.brakes[currentDirection]?.filter(b =>
                        searchKeys.includes(normalizeStationKey(b.station))
                    ) || [];

                    const ptBrake = stationBrakes.find(b => b.type === "PT_1");
                    const eptBrake = stationBrakes.find(b => b.type === "EPT_2");

                    if (ptBrake) {
                        tags.push(`ПТ ${ptBrake.km}пк${ptBrake.piket}`);
                        hasBrakes = true;
                    }
                    if (eptBrake) {
                        tags.push(`ЭПТ ${eptBrake.km}пк${eptBrake.piket}`);
                        hasBrakes = true;
                    }
                } else if (isLast) {
                    const deadEndMatch = sprDataCache.brakes.dead_ends?.find(b =>
                        searchKeys.includes(normalizeStationKey(b.station))
                    );

                    if (deadEndMatch) {
                        const trackInfo = deadEndMatch.track ? ` (${deadEndMatch.track})` : '';
                        tags.push(`Тупик ${deadEndMatch.km}пк${deadEndMatch.piket}${trackInfo}`);
                        hasBrakes = true;
                    }
                }

                if (tags.length > 0) {
                    brakeHtml = `<div class="route${D}tags${D}container">${tags.map(tag =>
                        `<div class="route${D}brake${D}box"><span class="route${D}brake${D}text">${escapeHtml(tag)}</span></div>`
                    ).join('')}</div>`;
                }
            }

            const stationTitle = escapeHtml(stop.station?.title || 'Станция');

            return `
                <div class="station${D}node${isActive ? ' active' : ''}${hasBrakes ? ' has-brakes' : ''}${isTerminal ? ' terminal' : ''}">
                    <div class="station${D}dot" data-km="${kmText ? escapeHtml(kmText) : '•'}"></div>
                    <div class="station${D}card${hasBrakes ? ' has-brakes' : ''}">
                        <div class="card${D}row${D}top">
                            <span class="station${D}name">${stationTitle}</span>
                            <span class="time${D}badge">${escapeHtml(timeText)}</span>
                        </div>
                        ${brakeHtml ? `<div class="card${D}row${D}bottom">${brakeHtml}</div>` : ''}
                    </div>
                </div>
            `;
        }).join('');

        results.style.display = 'block';
        results.style.animation = 'none';
        void results.offsetHeight;
        results.style.animation = '';
        updateScheduleEmptyState();
    }

    async function viewTrainSchedule(trainUid, trainNumber) {
        document.getElementById('singleTrain').value = trainNumber;
        const scheduleBtn = document.querySelector('.tab-btn[data-tab="tab-schedule"]');
        if (scheduleBtn) switchTab('tab-schedule', scheduleBtn);
        
        const loader = document.getElementById('scheduleLoader');
        const results = document.getElementById('scheduleResults');
        const header = document.getElementById('scheduleHeader');
        loader.style.display = 'flex';
        results.style.display = 'none';
        header.style.display = 'none';
        updateScheduleEmptyState();
        
        const trainMeta = await searchTrainByNumberSmart(trainNumber);
        loader.style.display = 'none';
        
        if (trainMeta) {
            const selectedDate = getSelectedDate();
            renderTimelineFromData(trainMeta.stops, trainNumber, selectedDate);
        } else {
            updateScheduleEmptyState();
        }
    }
</script>
